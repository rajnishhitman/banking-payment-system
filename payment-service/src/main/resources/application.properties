spring.application.name=payment-service
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5433/payment_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Expose Actuator endpoints for local monitoring
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents

# Circuit Breaker configuration
resilience4j.circuitbreaker.instances.accountService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=4
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true

#Property	                            Meaning
#slidingWindowSize->                     4	Evaluate the latest four calls.
#minimumNumberOfCalls->                  4	Wait until four calls have been recorded before calculating the failure rate.
#failureRateThreshold->                  50	Open the circuit when at least 50% of the evaluated calls fail.
#waitDurationInOpenState->               15s Keep the circuit open for 15 seconds before recovery testing.
#permittedNumberOfCallsInHalfOpenState-> 2	Allow up to two trial calls during recovery.
